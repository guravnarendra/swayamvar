# ========================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Single Web Service: Frontend (Vite) + Backend (Node/Socket.IO)
# ========================================================
services:
  - type: web
    name: swayamvar-fullstack
    runtime: node
    plan: free
    region: singapore # Closest region to India for lowest latency (~40ms)
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard -> Environment
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard -> Environment
